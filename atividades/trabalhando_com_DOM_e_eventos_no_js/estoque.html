<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estoque.css">
    <title>Gestão de Estoque</title>
</head>

<body>

    <main class="estoque-wrapper">

        <!-- Cabeçalho -->
        <div class="estoque-header">
            <div class="header-left">
                <img class="img-logo" src="img/a2e5f86a-6255-4836-b898-486021542a62.png">
                <h1>Produtos em Estoque</h1>
            </div>

            <button class="btn-novo">Novo Produto</button>
        </div>

        <!-- Filtro -->
        <div class="estoque-filtro">
            <input type="text" placeholder="Buscar produto...">
            <button>🔍</button>
        </div>

        <!-- Tabela -->
        <div class="tabela-container">
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Produto</th>
                        <th>Categoria</th>
                        <th>Preço Unit.</th>
                        <th>Estoque Atual</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>000001</td>
                        <td>Milho de Pipoca</td>
                        <td>Grãos</td>
                        <td>R$ 10,00</td>
                        <td>60</td>
                        <td class="acoes">
                            <button class="editar">✏️</button>
                            <button class="excluir">🗑️</button>
                        </td>
                    </tr>

                    <tr>
                        <td>000002</td>
                        <td>Feijão</td>
                        <td>Grãos</td>
                        <td>R$ 8,40</td>
                        <td>15</td>
                        <td class="acoes">
                            <button class="editar">✏️</button>
                            <button class="excluir">🗑️</button>
                        </td>
                    </tr>

                    <tr>
                        <td>000003</td>
                        <td>Arroz</td>
                        <td>Grãos</td>
                        <td>R$ 12,50</td>
                        <td>20</td>
                        <td class="acoes">
                            <button class="editar">✏️</button>
                            <button class="excluir">🗑️</button>
                        </td>
                    </tr>

                    <tr>
                        <td>000004</td>
                        <td>Trigo</td>
                        <td>Grãos</td>
                        <td>R$ 17,40</td>
                        <td>45</td>
                        <td class="acoes">
                            <button class="editar">✏️</button>
                            <button class="excluir">🗑️</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </main>

</body>

</html>
