<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Alunos</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="box">
        <form action="" method="POST">
            <fieldset>

                <legend>
                    <h1>Cadastro de Aluno</h1>
                </legend>

                <div class="inputBox">
                    <input type="text" name="nome_completo" id="nome_completo" class="inputUser" required>
                    <label for="" class="labelInput">Nome Completo</label>
                </div><br>

                <div class="inputBox">
                    <input type="text" name="" id="" class="inputUser" required>
                    <label for="" class="labelInput">Matrícula</label>
                </div><br>

                <div class="inputBox">
                    <input type="email" name="email" id="email" class="inputUser" required>
                    <label for="" class="labelInput">Email</label><br>
                </div><br>

                <div class="inputBox">
                    <input type="tel" name="telefone" id="telefone" class="inputUser" required>
                    <label for="" class="labelInput">Telefone</label><br>
                </div><br>

                <p><b>Sexo:</b></p>
                <input type="radio" id="feminino" name="genero" value="feminino" required>
                <label for="">Feminino</label>
                <input type="radio" id="masculino" name="genero" value="masculino" required>
                <label for="">Masculino</label><br><br>

                <label for=""><b>Data de Nascimento:</b></label>
                <input type="date" name="data_nasc" id="data_nasc" required>
                <br><br>

                <div class="inputBox">
                    <input type="text" name="cidade" id="cidade" class="inputUser" required>
                    <label for="" class="labelInput">Cidade</label><br>
                </div><br>

                <div class="inputBox">
                    <input type="text" name="estado" id="estado" class="inputUser" required>
                    <label for="" class="labelInput">Estado</label><br>
                </div><br>

                <div class="inputBox">
                    <input type="text" name="endereco" id="endereco" class="inputUser" required>
                    <label for="" class="labelInput">Endereço</label><br>
                </div><br>

                <div style="display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;">
                    <a><input type="submit" name="btn-cadastrar" class="btn-cadastrar" value="Cadastrar"></a>
                </div>

            </fieldset>
        </form>
    </div>
</body>

</html>
