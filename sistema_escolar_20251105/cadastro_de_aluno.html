<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Alunos</title>
    <link rel="stylesheet" href="">
</head>

<body>
    <div class="box">
        <form action="" method="POST">
            <fieldset>

                <legend>
                    <h1>Cadastro de Aluno</h1>
                </legend>

                <div class="inputBox">
                    <label for="" class="">Nome Completo:</label><br>
                    <input type="text" name="nome_completo" id="nome_completo" class="" required>
                </div><br>

                <div class="inputBox">
                    <label for="" class="">Matrícula:</label><br>
                    <input type="text" name="" id="" class="" required>
                </div><br>

                <div class="inputBox">
                    <label for="" class="">Email:</label><br>
                    <input type="email" name="email" id="email" class="" required>
                </div><br>

                <div class="inputBox">
                    <label for="" class="">Telefone:</label><br>
                    <input type="tel" name="telefone" id="telefone" class="" required>
                </div><br>

                <p><b>Sexo:</b></p>
                <input type="radio" id="feminino" name="genero" value="feminino" required>
                <label for="">Feminino</label>
                <input type="radio" id="masculino" name="genero" value="masculino" required>
                <label for="">Masculino</label><br><br><br>

                <label for=""><b>Data de Nascimento:</b></label>
                <input type="date" name="data_nasc" id="data_nasc" required>
                <br><br>

                <div class="inputBox">
                    <label for=" class="">Cidade:</label><br>
                <input type=" text" name="cidade" id="cidade" class="" required>
                </div><br>

                <div class="inputBox">
                    <label for="" class="">Estado:</label><br>
                    <input type="text" name="estado" id="estado" class="" required>
                </div><br>

                <div class="inputBox">
                    <label for="" class="">Endereço:</label><br>
                    <input type="text" name="endereco" id="endereco" class="" required>
                </div><br>

                <div style="display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;">
                    <a><input type="submit" name="btn-cadastrar" class="btn-cadastrar" value="Cadastrar"></a>
                </div>

            </fieldset>
        </form>
    </div>
</body>

</html>
