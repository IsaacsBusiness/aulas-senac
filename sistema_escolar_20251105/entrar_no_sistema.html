<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="box">
        <form>

            <fieldset>
                <legend>
                    <h1>Conectar ao Sistema</h1>
                </legend>

                <div class="inputBox">
                    <input type="text" name="" id="matricula" class="inputUser" required><br />
                    <label for="" class="labelInput">Matrícula:</label><br />
                </div>

                <div class="inputBox">
                    <input type="text" name="" id="colaborador" class="inputUser" required><br />
                    <label for="" class="labelInput">Colaborador:</label><br />
                </div>

                <div class="inputBox">
                    <input type="password" name="" id="senha" class="inputUser" required><br />
                    <label for="" class="labelInput">Senha:</label><br />
                </div>

                <div style="display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;">
                    <a href=""><input type="submit" name="btn-entrar" class="btn-entrar" value="Entrar" /></a>
                </div>
            </fieldset>

        </form>
    </div>

</body>

</html>
